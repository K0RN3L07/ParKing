<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ParKing | Adminfelület</title>
</head>

<body>

  <main>
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script type="module" src="./renderer.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="../assets/css/main.css">

    <title>ParKing - Adminfelület</title>
</head>

<body class="container-fluid bg-dark text-light position-relative">
    <nav class="navbar bg-secondary bg-gradient w-100">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="../assets/img/img_logo.png" alt="Logo" width="40" height="40" class="me-2">
                <span class="h4 mb-0 text-light">ParKing Admin</span>
            </a>
        </div>
    </nav>

    <i title="Újratöltés" class="bi bi-arrow-clockwise fs-3 position-absolute" id="refreshButton"
        style="top: 5px;right: 10px;cursor: pointer;"></i>

    <div class="row vh-100">
        <aside class="col-2 bg-dark bg-gradient text-white p-4">
            <h4>Menü</h4>
            <ul class="nav flex-column gap-2 p-2">
                <li class="nav-item"><a class="nav-link text-white bg-primary rounded-2" id="mainTab"><i
                            class="bi bi-house me-2"></i>Kezdőlap</a></li>
                <li class="nav-item"><a class="nav-link text-white rounded-2" id="usersTab"><i
                            class="bi bi-person me-2"></i>Felhasználók</a></li>
                <li class="nav-item"><a class="nav-link text-white rounded-2" id="bookingsTab"><i
                            class="bi bi-calendar me-2"></i>Foglalások</a></li>
                <li class="nav-item"><a class="nav-link text-white rounded-2" id="parkingSpacesTab"><i
                            class="bi bi-p-square me-2"></i>Parkolóhelyek</a></li>
                <li class="nav-item"><a class="nav-link text-white rounded-2" id="messagesTab"><i
                            class="bi bi-chat-left-text me-2"></i>Üzenetek</a></li>
                <li class="nav-item"><a class="nav-link text-white rounded-2" id="settingsTab"><i
                            class="bi bi-gear me-2"></i>Beállítások</a></li>
            </ul>
        </aside>

        <div class="col-10 p-4" id="mainContent">
            <!-- Content Loads From JS Dynamically -->
        </div>
    </div>
</body>

</html>
  </main>

</body>
</html>
