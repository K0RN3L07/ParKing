<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="renderer.js" defer></script>
    <link rel="stylesheet" href="../node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../node_modules/bootstrap-icons/font/bootstrap-icons.min.css">
    <script src="../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <title>ParKing - Adminfelület</title>
</head>

<body class="container-fluid bg-dark text-light position-relative">
    <h1 class="text-center h1">ParKing Adminfelület</h1>

    <i title="Újratöltés" class="bi bi-arrow-clockwise fs-3 position-absolute" id="refreshButton"
        style="top: 5px;right: 10px;cursor: pointer;"></i>

    <table class="table table-striped table-bordered table-dark table-hover text-center mx-auto mt-5" style="max-width: 1200px;">
        <thead>
            <tr>
                <th class="text-center">ID</th>
                <th class="text-center">Name</th>
                <th class="text-center">Email</th>
                <th class="text-center">Phone Number</th>
                <th class="text-center">Password</th>
                <th class="text-center">Registered At</th>
                <th class="text-center">Módosítás</th>
                <th class="text-center">Törlés</th>
            </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>
</body>

</html>
