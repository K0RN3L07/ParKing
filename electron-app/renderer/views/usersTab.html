<h1>Felhasználók</h1>

<div id="table-container" class="mx-auto mt-3" style="max-width:1200px; max-height:750px;overflow-y: auto;">
    <table class="table table-striped table-bordered table-dark table-hover text-center mx-auto"
        style="max-width: 1200px;">
        <thead>
            <tr>
                <th class="text-center">ID</th>
                <th class="text-center">Név</th>
                <th class="text-center">Email cím</th>
                <th class="text-center">Telefonszám</th>
                <th class="text-center">Jelszó</th>
                <th class="text-center">Regisztráció dátuma</th>
                <th class="text-center">Műveletek</th>
            </tr>
        </thead>
        <tbody id="userTable"></tbody>
    </table>
</div>

<div class="modal fade" id="editUserModal" tabindex="-1" data-bs-theme="dark">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="exampleModalLabel">Felhasználó Szerkesztése</h1>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Bezárás"></button>
            </div>
            <div class="modal-body">
                <div class="my-2">
                    <label for="name" class="form-label">Név:</label>
                    <input type="text" class="form-control" id="name">
                </div>

                <div class="my-2">
                    <label for="emailAddress" class="form-label">Email cím:</label>
                    <input type="email" class="form-control" id="emailAddress">
                </div>

                <div class="my-2">
                    <label for="phoneNum" class="form-label">Telefonszám:</label>
                    <input type="text" class="form-control" id="phoneNum">
                </div>

                <div class="my-2">
                    <label for="password" class="form-label">Jelszó:</label>
                    <input type="password" class="form-control" id="password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Mégsem</button>
                <button type="button" class="btn btn-success" id="saveChangesBtn">Változtatások mentése</button>
            </div>
        </div>
    </div>
</div>
